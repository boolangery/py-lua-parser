# Read the Docs build configuration.
# The docs live under doc/, not at the repository root, so the path to conf.py
# has to be spelled out. See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: doc/source/conf.py
  # conf.py reads the version out of the package and astnodes.rst documents
  # every node class, so a warning here means the docs have drifted from the
  # code: fail the build rather than publish something stale.
  fail_on_warning: true

python:
  install:
    - requirements: doc/requirements.txt
    # autodoc imports luaparser, which needs antlr4 and multimethod present.
    - method: pip
      path: .

formats:
  - pdf
